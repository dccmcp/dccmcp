name: license-boundary

on:
  pull_request:
  push:
    branches: [main]

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # No dependencies: the checks use node built-ins only.
      - name: License boundary (rules 1–3, 5)
        run: npm run check:boundary
      - name: Generated files untouched (rule 4)
        run: npm run check:generated
